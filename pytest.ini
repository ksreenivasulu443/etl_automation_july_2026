    regression: Regression tests
    data_quality: Data quality validation tests
    reconciliation: Source-to-target reconciliation tests
    sanity : sanity tests
    functional: functional tests
    prodrelease:prod release tests

# Command-line options applied automatically
addopts = -v -s C:\\Users\\Haritha\\PycharmProjects\\etl_automation_july_2026\\tests\\day4_hooks_fixtures_init
# Minimum pytest version
minversion = 8.0